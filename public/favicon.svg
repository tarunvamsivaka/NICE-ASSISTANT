<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="gAcc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="gCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0d4ff"/>
      <stop offset="60%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>
  </defs>
  <!-- Dark background -->
  <rect width="512" height="512" rx="108" fill="#08081a"/>
  <!-- Outer diamond / eye shape — top arc -->
  <path d="M256 108 C340 108 430 180 460 256 C430 332 340 404 256 404 C172 404 82 332 52 256 C82 180 172 108 256 108Z"
        fill="none" stroke="url(#gMain)" stroke-width="18" stroke-linejoin="round"/>
  <!-- Inner iris circle -->
  <circle cx="256" cy="256" r="72" fill="none" stroke="url(#gAcc)" stroke-width="14"/>
  <!-- Core pupil — glowing center -->
  <circle cx="256" cy="256" r="32" fill="url(#gCore)"/>
  <!-- Highlight spark -->
  <circle cx="240" cy="240" r="10" fill="white" opacity="0.6"/>
  <!-- Three orbital dots — representing intelligence/awareness -->
  <circle cx="256" cy="118" r="10" fill="#c084fc" opacity="0.9"/>
  <circle cx="370" cy="340" r="8" fill="#06b6d4" opacity="0.7"/>
  <circle cx="142" cy="340" r="8" fill="#f472b6" opacity="0.7"/>
</svg>
